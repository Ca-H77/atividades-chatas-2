<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urna</title>
<style>
body{font-family:sans-serif;max-width:320px;margin:20px auto;text-align:center;background:#ddd;color:#111}
#tela{background:#fff;border:3px solid #111;padding:12px;margin-bottom:12px}
#num{font-size:2rem;letter-spacing:6px;min-height:2.4rem}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{padding:14px;font-size:1.2rem;background:#222;color:#fff;border:0;border-radius:6px}
.corrige{background:#e8742c}
.confirma{background:#2e9e4f}
</style>
</head>
<body>
<div id="tela">
  <h2 id="cargo"></h2>
    <div id="num"></div>
      <p id="nome"></p>
      </div>
      <div class="teclas" id="teclas"></div>
      <div class="teclas" style="margin-top:8px">
        <button class="corrige" onclick="digitos='';mostrar()">CORRIGE</button>
          <span></span>
            <button class="confirma" onclick="confirmar()">CONFIRMA</button>
            </div>

            <script>
            const cargos = [
              { nome: "Presidente", candidatos: { "23": "Bolsolula", "66": "Imperador Palpatine", "25": "Funny Valentine" } },
                { nome: "Governador", candidatos: { "13": "Zé do Caranguejo", "45": "Capitão Frevo", "50": "Dra. Aurora Sertão" } }
                ];
                let etapa = 0, digitos = "";

                for (const n of [1,2,3,4,5,6,7,8,9,"",0]) {
                  const b = n === "" ? document.createElement("span") : Object.assign(document.createElement("button"), { textContent: n, onclick: () => { if (digitos.length < 2) { digitos += n; mostrar(); } } });
                    teclas.appendChild(b);
                    }

                    function mostrar() {
                      const c = cargos[etapa];
                        cargo.textContent = c.nome;
                          num.textContent = digitos;
                            nome.textContent = digitos.length < 2 ? "" : (c.candidatos[digitos] || "Número inválido");
                            }

                            function confirmar() {
                              const nomeCand = cargos[etapa].candidatos[digitos];
                                if (!nomeCand) return;
                                  alert("Você votou em: " + nomeCand);
                                    digitos = "";
                                      etapa++;
                                        if (etapa >= cargos.length) { tela.innerHTML = "<h2>FIM</h2>"; return; }
                                          mostrar();
                                          }

                                          mostrar();
                                          </script>
                                          </body>
                                          </html>
