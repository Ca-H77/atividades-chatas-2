<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Urna Eletrônica</title>
        <style>
        :root{--bg:#d9d6cf;--body:#e9e6df;--screen:#f4f4ee;--ink:#1a1a1a;--key:#2b2b2b;--keyt:#fff;--line:#9a968c;
        box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1b;--body:#2c2c29;--screen:#e8e8e0;--line:#55534d}}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:12px}
        .urna{width:100%;max-width:440px;background:var(--body);border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:12px}
        .screen{background:var(--screen);color:#1a1a1a;border:3px solid #1a1a1a;border-radius:6px;padding:14px;min-height:300px;display:flex;flex-direction:column;gap:10px}
        .cargo{font-size:1.5rem;font-weight:700;margin:0}
        .dig{display:flex;gap:8px;align-items:center}
        .dig span{width:46px;height:56px;border:2px solid #1a1a1a;display:grid;place-items:center;font-size:2rem;font-weight:700;background:#fff}
        .info{flex:1;display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:start}
        .info p{margin:4px 0}
        .foto{width:90px;height:110px;border:2px solid #1a1a1a;display:grid;place-items:center;font-size:2.6rem;background:#ddd}
        .aviso{font-size:.85rem;border-top:2px solid #1a1a1a;padding-top:8px;margin-top:auto}
        .nulo{font-weight:700}
        .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:14px 0;background:var(--key);color:var(--keyt);font-size:1.4rem;font-weight:700;touch-action:manipulation}
        button:focus-visible{outline:3px solid #f5b800;outline-offset:2px}
        button:active{transform:translateY(1px)}
        .acoes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        .acoes button{font-size:.9rem;padding:16px 4px}
        .branco{background:#f4f4f0;color:#111;border:2px solid #111}
        .corrige{background:#e8742c;color:#111}
        .confirma{background:#2e9e4f;color:#fff}
        .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:16px;z-index:9}
        .modal.on{display:grid}
        .caixa{background:var(--screen);color:#1a1a1a;border:3px solid #1a1a1a;border-radius:8px;padding:22px;max-width:380px;width:100%;text-align:center}
        .caixa h2{margin:0 0 6px;font-size:1.3rem}
        .caixa .n{font-size:1.1rem;margin:6px 0 16px}
        .caixa button{padding:12px 28px;font-size:1rem}
        .fim{text-align:center;margin:auto;font-size:4rem;font-weight:800;letter-spacing:.1em}
        .res{font-size:.9rem;width:100%}
        .res div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0}
        </style>
        </head>
        <body>
        <main class="urna">
          <section class="screen" id="tela" aria-live="polite"></section>
            <div class="pad" id="pad"></div>
              <div class="acoes">
                  <button class="branco" id="bBranco">BRANCO</button>
                      <button class="corrige" id="bCorrige">CORRIGE</button>
                          <button class="confirma" id="bConfirma">CONFIRMA</button>
                            </div>
                            </main>

                            <div class="modal" id="modal" role="dialog" aria-modal="true">
                              <div class="caixa">
                                  <h2 id="mTit">Confirmação</h2>
                                      <p class="n" id="mMsg"></p>
                                          <button id="mOk">OK</button>
                                            </div>
                                            </div>

                                            <script>
                                            // ===== Configuração dos candidatos (fictícios) =====
                                            const CARGOS = [
                                              { nome: "Presidente", digitos: 2, candidatos: {
                                                  "23": { nome: "Bolsolula", partido: "PBL", foto: "🤝" },
                                                      "66": { nome: "Imperador Palpatine", partido: "IMP", foto: "👑" },
                                                          "25": { nome: "Funny Valentine", partido: "D4C", foto: "🎩" }
                                                            }},
                                                              { nome: "Governador", digitos: 2, candidatos: {
                                                                  "13": { nome: "Zé do Caranguejo", partido: "MNG", foto: "🦀" },
                                                                      "45": { nome: "Capitão Frevo", partido: "FRV", foto: "🎺" },
                                                                          "50": { nome: "Dra. Aurora Sertão", partido: "SOL", foto: "🌵" }
                                                                            }}
                                                                            ];

                                                                            let etapa = 0, digitos = "", escolhas = [], votoPendente = null;
                                                                            const votos = { Presidente:{}, Governador:{} };
                                                                            const $ = id => document.getElementById(id);

                                                                            // Teclado
                                                                            const pad = $("pad");
                                                                            [1,2,3,4,5,6,7,8,9,"",0,""].forEach(n => {
                                                                              if (n === "") { pad.appendChild(document.createElement("span")); return; }
                                                                                const b = document.createElement("button");
                                                                                  b.textContent = n; b.setAttribute("aria-label","Número "+n);
                                                                                    b.onclick = () => digitar(String(n));
                                                                                      pad.appendChild(b);
                                                                                      });

                                                                                      function beep(f=880,d=80){
                                                                                        try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();
                                                                                          o.frequency.value=f;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},d);}catch(e){}
                                                                                          }

                                                                                          function render(){
                                                                                            const t = $("tela");
                                                                                              if (etapa >= CARGOS.length) {
                                                                                                  let r = "";
                                                                                                      CARGOS.forEach(c => {
                                                                                                            r += `<strong>${c.nome}</strong>`;
                                                                                                                  const v = votos[c.nome];
                                                                                                                        const ks = Object.keys(v);
                                                                                                                              r += ks.length ? ks.map(k=>`<div><span>${k}</span><span>${v[k]} voto(s)</span></div>`).join("") : "<div><span>—</span><span>0</span></div>";
                                                                                                                                  });
                                                                                                                                      t.innerHTML = `<div class="fim">FIM</div><p style="text-align:center;margin:0">Seu voto foi registrado.</p>
                                                                                                                                            <div class="res"><strong>Apuração desta sessão</strong>${r}</div>`;
                                                                                                                                                $("bConfirma").textContent = "NOVO ELEITOR";
                                                                                                                                                    return;
                                                                                                                                                      }
                                                                                                                                                        $("bConfirma").textContent = "CONFIRMA";
                                                                                                                                                          const c = CARGOS[etapa];
                                                                                                                                                            let boxes = "";
                                                                                                                                                              for (let i=0;i<c.digitos;i++) boxes += `<span>${digitos[i]||""}</span>`;
                                                                                                                                                                let info = "";
                                                                                                                                                                  if (digitos.length === c.digitos) {
                                                                                                                                                                      const cand = c.candidatos[digitos];
                                                                                                                                                                          info = cand
                                                                                                                                                                                ? `<div><p>Nome: <strong>${cand.nome}</strong></p><p>Partido: ${cand.partido}</p></div><div class="foto">${cand.foto}</div>`
                                                                                                                                                                                      : `<div><p class="nulo">NÚMERO ERRADO</p><p class="nulo">VOTO NULO</p></div><div></div>`;
                                                                                                                                                                                        } else info = "<div></div><div></div>";
                                                                                                                                                                                          t.innerHTML = `<p style="margin:0;font-size:.85rem">Seu voto para</p>
                                                                                                                                                                                              <h1 class="cargo">${c.nome}</h1>
                                                                                                                                                                                                  <div class="dig">${boxes}</div>
                                                                                                                                                                                                      <div class="info">${info}</div>
                                                                                                                                                                                                          <div class="aviso">Aperte a tecla:<br>VERDE para CONFIRMAR este voto<br>LARANJA para REINICIAR este voto</div>`;
                                                                                                                                                                                                          }

                                                                                                                                                                                                          function digitar(n){
                                                                                                                                                                                                            if (etapa >= CARGOS.length) return;
                                                                                                                                                                                                              if (digitos.length < CARGOS[etapa].digitos) { digitos += n; beep(); render(); }
                                                                                                                                                                                                              }

                                                                                                                                                                                                              function abrirModal(msg, tit="Confirmação"){
                                                                                                                                                                                                                $("mTit").textContent = tit; $("mMsg").textContent = msg; $("modal").classList.add("on"); $("mOk").focus();
                                                                                                                                                                                                                }

                                                                                                                                                                                                                $("bCorrige").onclick = () => { digitos = ""; render(); };

                                                                                                                                                                                                                $("bBranco").onclick = () => {
                                                                                                                                                                                                                  if (etapa >= CARGOS.length) return;
                                                                                                                                                                                                                    if (digitos.length) return; // branco só com campo vazio
                                                                                                                                                                                                                      votoPendente = { chave:"Branco", texto:"Branco" };
                                                                                                                                                                                                                        abrirModal("Você votou em: Branco");
                                                                                                                                                                                                                        };

                                                                                                                                                                                                                        $("bConfirma").onclick = () => {
                                                                                                                                                                                                                          if (etapa >= CARGOS.length) { etapa = 0; digitos = ""; escolhas = []; render(); return; }
                                                                                                                                                                                                                            const c = CARGOS[etapa];
                                                                                                                                                                                                                              if (digitos.length < c.digitos) return;
                                                                                                                                                                                                                                const cand = c.candidatos[digitos];
                                                                                                                                                                                                                                  votoPendente = cand
                                                                                                                                                                                                                                      ? { chave: `${digitos} · ${cand.nome}`, texto: cand.nome }
                                                                                                                                                                                                                                          : { chave: "Nulo", texto: "Nulo" };
                                                                                                                                                                                                                                            abrirModal(`Você votou em: ${votoPendente.texto}`);
                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                            $("mOk").onclick = () => {
                                                                                                                                                                                                                                              const c = CARGOS[etapa];
                                                                                                                                                                                                                                                votos[c.nome][votoPendente.chave] = (votos[c.nome][votoPendente.chave]||0) + 1;
                                                                                                                                                                                                                                                  $("modal").classList.remove("on");
                                                                                                                                                                                                                                                    beep(520, 250);
                                                                                                                                                                                                                                                      etapa++; digitos = ""; votoPendente = null; render();
                                                                                                                                                                                                                                                      };

                                                                                                                                                                                                                                                      // Teclado físico
                                                                                                                                                                                                                                                      document.addEventListener("keydown", e => {
                                                                                                                                                                                                                                                        if ($("modal").classList.contains("on")) { if (e.key==="Enter") $("mOk").click(); return; }
                                                                                                                                                                                                                                                          if (/^[0-9]$/.test(e.key)) digitar(e.key)
                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                            render();
                                                                                                                                                                                                                                                            </script>
</body>
</html>
